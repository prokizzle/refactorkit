version: '3.8'
services:
  refactorkit:
    build: .
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    environment:
      - REFACTORKIT_LICENSE=${REFACTORKIT_LICENSE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: ["audit", "."]
